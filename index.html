<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>LayerLab</title>
    <meta name="description" content="Gestao de Impressao 3D" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E1040" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LayerLab" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Prevent zoom on input focus (iOS) -->
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      input, select, textarea { font-size: 16px !important; }
      /* Corrige date picker no iOS: alinha a esquerda e respeita largura */
      input[type="date"] {
        -webkit-appearance: none;
        appearance: none;
        min-height: 44px;
        text-align: left;
        display: block;
      }
      input[type="date"]::-webkit-date-and-time-value {
        text-align: left;
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(0.7) sepia(1) saturate(3) hue-rotate(230deg);
        cursor: pointer;
      }
      body {
        margin: 0;
        padding: 0;
        background: #1E1040;
        overscroll-behavior: none;
        font-family: 'Manrope', 'Segoe UI', sans-serif;
      }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
